[project]
site_name = "Xolo"
site_description = "Documentation officielle de Xolo — passerelle LLM souveraine"
site_author = "Xolo Gateway"
site_url = "https://xolo-gateway.org"

docs_dir = "content"
site_dir = "site"

repo_name = "xolo-gateway/xolo"
repo_url = "https://github.com/xolo-gateway/xolo"
edit_uri = ""

copyright = "Copyright © Xolo Gateway"

extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
variant = "modern"
language = "fr"
logo = "logo.svg"
favicon = "logo.svg"
custom_dir = "overrides"

[project.extra]
homepage = "https://xolo-gateway.org"

# Le contenu est multilingue (content/fr, content/en, content/es), publié dans
# une seule build versionnée par Mike. Le thème reste en langue "fr" (voir
# ci-dessus) : ce switcher ne fait qu'ajouter des liens de navigation entre
# les répertoires de langue, il ne traduit pas les chaînes du thème. Voir
# zensical.org/docs/setup/language pour la limitation HTML5 (une langue par
# document) qui motive ce choix plutôt que trois builds Zensical distinctes.
alternate = [
  { name = "Français", link = "fr/", lang = "fr" },
  { name = "English", link = "en/", lang = "en" },
  { name = "Español", link = "es/", lang = "es" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true