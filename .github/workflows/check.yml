name: Check documentation project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install local tools
        run: make tools-sync

      - name: Prepare documentation from Xolo main
        env:
          XOLO_REF: main
          XOLO_REPOSITORY: https://github.com/xolo-gateway/xolo.git
        run: make prepare

      - name: Build in strict mode
        run: make check