[project.extra.home.quickstart]
title = "In five minutes"
description = "A local instance, a key, a first call."

[[project.extra.home.quickstart.tabs]]
title = "docker"
code = """
$ docker run -p 8080:8080 \\
    ghcr.io/xolo-gateway/xolo:latest

# then, once the organisation is created
$ curl localhost:8080/v1/chat/completions \\
    -H "Authorization: Bearer $XOLO_KEY" \\
    -d '{"model":"gpt-4o-mini","messages":[…]}'
"""

[[project.extra.home.quickstart.tabs]]
title = "source"
code = """
$ git clone https://github.com/xolo-gateway/xolo
$ cd xolo && make run

# the interface listens on http://localhost:8080
"""

[project.extra.home.highlights]
title = "A free project, and so are you"
link = { title = "Read the code on GitHub", link = "https://github.com/xolo-gateway/xolo" }

[[project.extra.home.highlights.items]]
title = "Free to read, change, host"
description = "AGPL-3.0. One binary, one SQLite file, and Xolo runs on your machine with no account and no third-party service."

[[project.extra.home.highlights.items]]
title = "Free to switch providers"
description = "Your applications talk to a virtual model. Behind it, OpenAI, Mistral, OpenRouter, or Ollama and vLLM on your own hardware, swapped without touching client code."

[[project.extra.home.highlights.items]]
title = "Free to know what happens"
description = "Every request leaves an event you can filter with eventql: cost, latency, tokens, energy range. A budget at its cap blocks the next calls."
