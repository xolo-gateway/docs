[project]
site_name = "Xolo"
site_description = "Official Xolo documentation — sovereign LLM gateway"
site_author = "Xolo Gateway"
site_url = "https://xolo-gateway.org/en/"

docs_dir = "content/en"
site_dir = "site/en"

repo_name = "xolo-gateway/xolo"
repo_url = "https://github.com/xolo-gateway/xolo"
edit_uri = ""

copyright = "Copyright © Xolo Gateway"

extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
variant = "modern"
language = "en"
logo = "logo.svg"
favicon = "logo.svg"
custom_dir = "overrides"

features = [
  "navigation.sections",   # titled top-level groups in the nav
  "navigation.path",       # breadcrumb above the title
  "navigation.top",        # back to top
  "navigation.tracking",   # the URL tracks the section being read
  "toc.follow",            # the table of contents follows reading
  "content.code.copy",     # copy button on code blocks
  "search.highlight",      # highlight search terms
]

# Xolo identity: same families as the product (templui.css).
[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[project.extra]
homepage = "https://xolo-gateway.org"

# See zensical.fr.toml for why each language is a separate build deployed
# under its own Mike deploy-prefix.
alternate = [
  { name = "Français", link = "/latest/", lang = "fr" },
  { name = "English", link = "/en/latest/", lang = "en" },
  { name = "Español", link = "/es/latest/", lang = "es" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

# Home page (board 1a of "Refonte doc Xolo"): hero, three entry points, quick
# start and sovereignty panel. The overrides/main.html template renders this
# section instead of the body of content/en/index.md as soon as
# "Find an expert" page, built from the YAML files in xolo-gateway/org
# (experts/ directory): see scripts/prepare-experts.sh.
[project.extra.experts]
title = "Find an expert"
intro = """
These companies know Xolo and offer support: installation, hosting, \
training, plugin development. The project lists them, it does not \
mandate them and takes no cut of the work.\
"""
sponsor = "Sponsor"
empty = "No company is listed yet."
outro = """
To appear on this page, open a request on \
[the project repository](https://github.com/xolo-gateway/xolo/issues).\
"""

# [project.extra.home] is defined — removing this block restores the plain
# Markdown rendering.
[project.extra.home]
badge = "Official documentation"
title = "Take back control of your generative AI usage"
tagline = """
Xolo sits between your applications and the model providers. It holds the API \
keys, the budgets and the routing between models, and keeps a record of every \
request. One binary, licensed under AGPL-3.0.\
"""

