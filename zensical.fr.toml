[project.extra.home.paths]
title = "Par où commencer"
subtitle = "Trois parcours, selon votre rôle"

[[project.extra.home.paths.items]]
title = "Déployer"
description = """
Installation, configuration, plugins Go, provisioning. Pour les ops et les \
administrateurs.\
"""
icon = "deploy"
tone = "primary"
meta = "15 pages"
link = "administration/"
links = [
  { title = "Installation & déploiement", link = "administration/installation/" },
  { title = "Configuration", link = "administration/installation/configuration/" },
  { title = "API de provisioning", link = "administration/provisioning/provisioning/" },
]

[[project.extra.home.paths.items]]
