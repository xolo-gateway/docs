[project]
site_name = "Xolo"
site_description = "Documentation officielle de Xolo — passerelle LLM souveraine"
site_author = "Xolo Gateway"
site_url = "https://xolo-gateway.org"

docs_dir = "content/fr"
site_dir = "site/fr"

repo_name = "xolo-gateway/xolo"
repo_url = "https://github.com/xolo-gateway/xolo"
edit_uri = ""

copyright = "Copyright © Xolo Gateway"

extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
variant = "modern"
language = "fr"
logo = "logo.svg"
favicon = "logo.svg"
custom_dir = "overrides"

features = [
  "navigation.sections",   # groupes de premier niveau titrés dans la nav
  "navigation.path",       # fil d'Ariane au-dessus du titre
  "navigation.top",        # retour en haut de page
  "navigation.tracking",   # l'URL suit la section lue
  "toc.follow",            # le sommaire suit la lecture
  "content.code.copy",     # bouton copier sur les blocs de code
  "search.highlight",      # surlignage des termes trouvés
]

# Identité Xolo : mêmes familles que le produit (templui.css).
[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[project.extra]
homepage = "https://xolo-gateway.org"

# Chaque langue est un build Zensical indépendant (docs_dir scopé à
# content/<lang>), déployé par Mike sous son propre préfixe : voir
# scripts/publish-language.sh. Le français reste sans préfixe pour préserver
# les URLs existantes (xolo-gateway.org/latest/, /main/, /X.Y.Z/) ; anglais et
# espagnol sont sous /en/ et /es/. Ce switcher renvoie donc toujours vers la
# dernière version publiée de la langue cible, pas vers la page équivalente.
alternate = [
  { name = "Français", link = "/latest/", lang = "fr" },
  { name = "English", link = "/en/latest/", lang = "en" },
  { name = "Español", link = "/es/latest/", lang = "es" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

# Page d'accueil (planche 1a de « Refonte doc Xolo ») : hero, trois portes
# d'entrée, démarrage rapide et encart souveraineté. Le gabarit
# overrides/main.html rend cette section à la place du corps de content/fr/
# Page « Trouver un expert », alimentée par les fiches YAML de
# xolo-gateway/org (dossier experts/) : voir scripts/prepare-experts.sh.
[project.extra.experts]
title = "Trouver un expert"
intro = """
Ces entreprises connaissent Xolo et proposent de l'accompagnement : \
installation, hébergement, formation, développement de plugins. \
Le projet les référence, il ne les mandate pas et ne prend rien sur \
les prestations.\
"""
sponsor = "Sponsor"
empty = "Aucune entreprise n'est référencée pour le moment."
outro = """
Pour figurer sur cette page, ouvrez une demande sur \
[le dépôt du projet](https://github.com/xolo-gateway/xolo/issues).\
"""

# index.md dès que [project.extra.home] est défini — retirer ce bloc suffit à
# revenir au rendu Markdown classique.
[project.extra.home]
badge = "Documentation officielle"
title = "Reprenez le contrôle sur vos usages de l'IA générative"
tagline = """
Xolo se place entre vos applications et les fournisseurs de modèles. Il tient \
les clés d'API, les budgets et le routage entre modèles, et garde une trace de \
chaque requête. Un binaire, sous licence AGPL-3.0.\
"""

# Illustration animée du hero (planche 2a) à la place de la capture. Trois
# clients, trois fournisseurs, trois étapes : le gabarit
# overrides/partials/xolo-illustration.html est calé sur ces nombres.
[project.extra.home.illustration]
