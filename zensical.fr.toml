[project.extra.home.quickstart]
title = "En cinq minutes"
description = "Une instance locale, une clé, un premier appel."

[[project.extra.home.quickstart.tabs]]
title = "docker"
code = """
$ docker run -p 8080:8080 \\
    ghcr.io/xolo-gateway/xolo:latest

# puis, une fois l'organisation créée
$ curl localhost:8080/v1/chat/completions \\
    -H "Authorization: Bearer $XOLO_KEY" \\
    -d '{"model":"gpt-4o-mini","messages":[…]}'
"""

[[project.extra.home.quickstart.tabs]]
title = "source"
code = """
$ git clone https://github.com/xolo-gateway/xolo
$ cd xolo && make run

# l'interface écoute sur http://localhost:8080
"""

[project.extra.home.highlights]
title = "Un projet libre, et vous aussi"
link = { title = "Lire le code sur GitHub", link = "https://github.com/xolo-gateway/xolo" }

[[project.extra.home.highlights.items]]
title = "Libre de lire, modifier, héberger"
description = "Licence AGPL-3.0. Un binaire, une base SQLite, et Xolo tourne sur votre machine sans compte ni service tiers."

[[project.extra.home.highlights.items]]
title = "Libre de changer de fournisseur"
description = "Vos applications parlent à un modèle virtuel. Derrière, OpenAI, Mistral, OpenRouter, ou Ollama et vLLM chez vous, interchangeables sans toucher au code client."

[[project.extra.home.highlights.items]]
title = "Libre de savoir ce qui se passe"
description = "Chaque requête laisse un événement filtrable en eventql : coût, latence, tokens, fourchette d'énergie. Un budget atteint bloque les appels suivants."
