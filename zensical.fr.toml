"""
icon = "concept"
tone = "purple"
meta = "6 pages"
link = "concepts/"
links = [
  { title = "Organisation, rôles et permissions", link = "concepts/organisation-et-permissions/" },
  { title = "Fournisseurs, modèles et pipelines", link = "concepts/fournisseurs-modeles-pipeline/" },
  { title = "Budgets et quotas", link = "concepts/budgets-et-quotas/" },
]

